theme = "subhash"
baseURL = "https://subhash.net/"
defaultContentLanguage = "en"
timeZone = "Asia/Dubai"

enableRobotsTXT = true
enableGitInfo = true
summaryLength = 36
buildDrafts = false
buildFuture = false
enableEmoji = true
rssLimit = 20

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"

[permalinks]
  posts = "/posts/:slug/"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# -- Custom Output Formats --
[mediaTypes]
  [mediaTypes."text/llms"]
    suffixes = ["txt"]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/llms"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    notAlternative = true
  # Search index for the theme's client-side search. Separate from the JSON
  # Feed at /index.json, which is a publishing format and carries full HTML.
  [outputFormats.searchindex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "llms", "searchindex"]
  section = ["HTML", "RSS"]
  page = ["HTML", "markdown"]

[related]
  threshold = 80
  toLower = true

    [[related.indices]]
      name = "tags"
      weight = 100

    [[related.indices]]
      name = "categories"
      weight = 100

    [[related.indices]]
      name = "date"
      weight = 10
