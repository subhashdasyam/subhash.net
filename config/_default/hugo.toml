theme = "subhash"
baseURL = "https://subhash.net/"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 30
buildDrafts = false
# The newest post is dated 2026-07-18. Without this it is excluded from the
# build whenever the clock is behind that date.
buildFuture = true
enableEmoji = true

[pagination]
  pagerSize = 5   # matches subhashdasyam.com's 5-posts-per-page homepage

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# -- Custom Output Formats --
[mediaTypes]
  [mediaTypes."text/llms"]
    suffixes = ["txt"]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/llms"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    notAlternative = true
  # Search index for the theme's client-side search. Separate from the JSON
  # Feed at /index.json, which is a publishing format and carries full HTML.
  [outputFormats.searchindex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "llms", "searchindex"]
  section = ["HTML", "RSS"]
  page = ["HTML", "markdown"]

[related]
  # threshold 0 accepted ANY non-zero score, so the `date` index alone made two
  # posts "related" purely for being published near each other -- every article
  # ended up suggesting whatever was nearest in time. 80 requires real tag
  # overlap; single.html falls back to a spread-out pick when nothing qualifies.
  threshold = 80
  toLower = true

    [[related.indices]]
      name = "tags"
      weight = 100

    [[related.indices]]
      name = "categories"
      weight = 100

    [[related.indices]]
      name = "date"
      weight = 10
