{{/* /tags/ -- the full SYSTEM TAGS index, rendered as one card of chips. */}}
{{ define "main" }}
<article class="post">
  <h1 class="post-title">{{ .Title }}</h1>
  <div class="post-meta">
    <span>INDEX: {{ len .Data.Terms }} tags</span>
  </div>
  <div class="post-body">
    <div class="post-tags" style="border-top:none; padding-top:0; margin-top:0;">
      <ul>
        {{- range .Data.Terms.Alphabetical }}
        <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} ({{ .Count }})</a></li>
        {{- end }}
      </ul>
    </div>
  </div>
</article>
{{ end }}
