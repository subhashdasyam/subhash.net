{{/* Provide both directions once the list spans more than one page. */}}
{{- with .Paginator }}
  {{- if gt .TotalPages 1 }}
<div class="blog-pager">
  {{- if .HasPrev }}
  <a class="read-more-link" href="{{ .Prev.URL }}">&lt; PREV</a>
  {{- else }}
  <span></span>
  {{- end }}
  {{- if .HasNext }}
  <a class="read-more-link" href="{{ .Next.URL }}">NEXT &gt;</a>
  {{- end }}
</div>
  {{- end }}
{{- end }}
